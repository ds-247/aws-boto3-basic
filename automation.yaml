AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation Template for creating two S3 buckets

Parameters:
  SrcBucketName:
    Type: String
    Default: src-bkt-04-28
    Description: Name of the source S3 bucket

  DestBucketName:
    Type: String
    Default: dst-bkt-04-28
    Description: Name of the destination S3 bucket

  LambdaCodeBucket:
    Type: String
    Default: lambda-code-to-copy-s3-bucket
    Description: Name of the S3 bucket where Lambda code is stored
  
  LambdaCodeBucketObjectKey:
    Type: String
    Default: code-folder/file-copy-lambda.zip
    Description: S3 object key for the Lambda code zip file

  LambdaHandler:
    Type: String
    Default: lambda_logic.lambda_handler
    Description: Lambda function handler (fileName.functionName)

  LambdaRuntimeVersion:
    Type: String
    Default: python3.12
    Description: Lambda runtime version to use.


Resources:
  SrcBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Ref SrcBucketName

  DestBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketName: !Ref DestBucketName

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntimeVersion
      Role: arn:aws:iam::194325853642:role/lambda-s3-access-role # IAM role that Lambda will use
      Handler: !Ref LambdaHandler  # Entry point: fileName.functionName
      Environment:
        Variables:
          DEST_BUCKET: !Ref DestBucketName
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeBucketObjectKey

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt SrcBucket.Arn

  S3NotificationCustomResourceLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: !Ref LambdaRuntimeVersion
      Role: arn:aws:iam::194325853642:role/lambda-s3-access-role
      Handler: index.handler
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              s3 = boto3.client('s3')
              props = event['ResourceProperties']
              try:
                  s3.put_bucket_notification_configuration(
                      Bucket=props['BucketName'],
                      NotificationConfiguration={
                          'LambdaFunctionConfigurations': [
                              {
                                  'LambdaFunctionArn': props['LambdaArn'],
                                  'Events': ['s3:ObjectCreated:*']
                              }
                          ]
                      }
                  )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Message': str(e)})

  AttachLambdaToS3:
    Type: Custom::S3Notification
    DependsOn:
      - LambdaInvokePermission
    Properties:
      ServiceToken: !GetAtt S3NotificationCustomResourceLambda.Arn
      BucketName: !Ref SrcBucket
      LambdaArn: !GetAtt LambdaFunction.Arn
