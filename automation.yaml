AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation Template for creating two S3 buckets

Resources:
  SrcBucket:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete
    Properties:
      BucketName: src-bkt-04-28

  DestBucket:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete
    Properties:
      BucketName: dst-bkt-04-28
